name: Build V50 Kernel 4.14.190-perf+

on:
  workflow_dispatch:
  push:
    branches:
      - R
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'include/**'
      - '**/Makefile'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel source (R branch, official 4.14.190)
        uses: actions/checkout@v4
        with:
          branch: R
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget \
            make binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev python3 \
            cpio zip unzip \
            ca-certificates

      # ---- Clang 10.0.7 for NDK : 官方 V50 内核源码同款工具链(2022) ----
      - name: Download Android NDK Clang 10.0.7 toolchain
        run: |
          mkdir -p "$HOME/toolchains/clang-ndk"
          curl -L -o /tmp/clang-ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip"
          unzip -q /tmp/clang-ndk.zip -d "$HOME/toolchains"
          rm -f /tmp/clang-ndk.zip
          ls "$HOME/toolchains/" | grep ndk
          echo "CLANG_BASE=$HOME/toolchains/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      # ---- binutils 2.27 (GNU ld 2.27, 官方同款) ----
      - name: Build binutils 2.27 for aarch64
        run: |
          mkdir -p "$HOME/binutils-2.27"
          curl -L -o /tmp/binutils-2.27.tar.bz2 \
            "https://mirrors.tuna.tsinghua.edu.cn/gnu/binutils/binutils-2.27.tar.bz2"
          tar xjf /tmp/binutils-2.27.tar.bz2 -C "$HOME/binutils-2.27" --strip-components=1
          rm -f /tmp/binutils-2.27.tar.bz2
          cd "$HOME/binutils-2.27"
          ./configure --target=aarch64-linux-gnu --prefix="$HOME/toolchain-binutils" \
            --disable-nls --disable-werror --quiet
          make -j"$(nproc)" > /dev/null 2>&1
          make install > /dev/null 2>&1
          echo "BINUTILS_PATH=$HOME/toolchain-binutils/bin" >> "$GITHUB_ENV"

      - name: Build kernel with perf+ localversion
        run: |
          set -e
          export PATH="$CLANG_BASE/bin:$BINUTILS_PATH:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang

          mkdir -p out
          # 使用从可开机 boot.img 提取的精确配置(含 LOCALVERSION=-perf)
          make O=out CC=clang ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/flashlmdd_lao_com-perf_boot.config

          # 强制 LOCALVERSION = -perf+ (与官方 boot.img 版本号一致)
          sed -i 's/CONFIG_LOCALVERSION="[^"]*"/CONFIG_LOCALVERSION="-perf+"/' out/.config
          echo "LOCALVERSION set to:" ; grep CONFIG_LOCALVERSION out/.config

          make O=out CC=clang ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out-artifacts
          cp out/arch/arm64/boot/Image.gz-dtb out-artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image      out-artifacts/ 2>/dev/null || true
          cp out/.config                    out-artifacts/ 2>/dev/null || true
          ls -la out-artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v50-kernel-4.14.190-perf-plus
          path: out-artifacts/
          if-no-files-found: warn
