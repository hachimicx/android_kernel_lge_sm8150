name: Build V50 Kernel 4.14.190-perf+ KSUN SUSFS Droidspaces

on:
  workflow_dispatch:
  push:
    branches:
      - R
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'include/**'
      - '**/Makefile'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout kernel source (R branch, official 4.14.190)
        uses: actions/checkout@v4
        with:
          branch: R
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget \
            make binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev python3 \
            cpio zip unzip \
            ca-certificates

      # ---- Android NDK Clang 10.0.7 (r21e) ----
      - name: Download Android NDK Clang 10.0.7 toolchain
        run: |
          mkdir -p "$HOME/toolchains"
          curl -L -o /tmp/android-ndk-r21e.zip \
            "https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip"
          unzip -q /tmp/android-ndk-r21e.zip -d "$HOME/toolchains"
          rm -f /tmp/android-ndk-r21e.zip
          echo "CLANG_BASE=$HOME/toolchains/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      # ---- binutils 2.27 ----
      - name: Build binutils 2.27 for aarch64
        run: |
          mkdir -p "$HOME/binutils-2.27"
          curl -L -o /tmp/binutils-2.27.tar.bz2 \
            "https://mirrors.tuna.tsinghua.edu.cn/gnu/binutils/binutils-2.27.tar.bz2" || \
          curl -L -o /tmp/binutils-2.27.tar.bz2 \
            "https://ftp.gnu.org/gnu/binutils/binutils-2.27.tar.bz2"
          tar xjf /tmp/binutils-2.27.tar.bz2 -C "$HOME/binutils-2.27" --strip-components=1
          rm -f /tmp/binutils-2.27.tar.bz2
          cd "$HOME/binutils-2.27"
          ./configure --target=aarch64-linux-gnu --prefix="$HOME/toolchain-binutils" \
            --disable-nls --disable-werror --quiet
          make -j"$(nproc)" > /dev/null 2>&1
          make install > /dev/null 2>&1
          echo "BINUTILS_PATH=$HOME/toolchain-binutils/bin" >> "$GITHUB_ENV"

      # ---- KernelSU Next (legacy-susfs-v2 branch) ----
      - name: Clone KernelSU Next (legacy-susfs-v2 branch)
        run: |
          git clone --depth 1 --branch legacy-susfs-v2 \
            https://github.com/sidex15/KernelSU-Next.git KernelSU

      # ---- Droidspaces non-GKI patches ----
      - name: Apply Droidspaces non-GKI patches
        run: |
          curl -sL -o /tmp/ds1.patch \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
          curl -sL -o /tmp/ds2.patch \
            "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          patch -p1 < /tmp/ds1.patch || true
          patch -p1 < /tmp/ds2.patch || true
          echo "Droidspaces patches applied"

      - name: Configure kernel (boot.config + Droidspaces + KSUN + perf+)
        run: |
          set -e
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p out
          cp arch/arm64/configs/vendor/flashlmdd_lao_com-perf_boot.config out/.config

          # Droidspaces mandatory configs
          printf '%s\n' \
            'CONFIG_SYSVIPC=y' \
            'CONFIG_POSIX_MQUEUE=y' \
            'CONFIG_PID_NS=y' \
            'CONFIG_IPC_NS=y' \
            'CONFIG_CGROUP_DEVICE=y' \
            'CONFIG_CGROUP_PIDS=y' \
            'CONFIG_CGROUP_NET_PRIO=y' \
            'CONFIG_DEVTMPFS=y' \
            'CONFIG_FW_LOADER_COMPRESS=y' \
            'CONFIG_NF_TABLES=y' \
            'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y' \
            'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' \
            'CONFIG_NF_CONNTRACK_NETLINK=y' \
            'CONFIG_USER_NS=y' \
            '# CONFIG_ANDROID_PARANOID_NETWORK is not set' >> out/.config

          # KernelSU Next flags
          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_SUS_MAP=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' >> out/.config

          # LOCALVERSION = -perf+ (single +)
          sed -i 's/CONFIG_LOCALVERSION="[^"]*"/CONFIG_LOCALVERSION="-perf+"/' out/.config
          grep -E "LOCALVERSION|SYSVIPC|USER_NS|CONFIG_KSU|SUSFS" out/.config | head -20

          make O=out CC=clang ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          set -e
          export PATH="$CLANG_BASE/bin:$BINUTILS_PATH:$PATH"
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC=clang ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out-artifacts
          cp out/arch/arm64/boot/Image.gz-dtb out-artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image      out-artifacts/ 2>/dev/null || true
          cp out/.config                    out-artifacts/ 2>/dev/null || true
          ls -la out-artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v50-kernel-4.14.190-perf-ksun-droidspaces
          path: out-artifacts/
          if-no-files-found: warn
